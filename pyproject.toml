[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deuterium"
version = "0.1.0"
description = "A fast, no-nonsense CLI tool for detecting SMS spam using scikit-learn."
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
# Registers the `deuterium` command inside the virtual environment
deuterium = "deuterium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
